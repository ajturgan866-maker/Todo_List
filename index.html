<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Список задач</h1>

    <label for="task-input" class="label">Введите вашу задачу:</label>

    <div class="form-row">
      <input type="text" id="task-input" autocomplete="off">
      <button id="add-btn" type="button">Добавить</button>
    </div>

    <ul id="todo-list"></ul>

    <p id="empty-message" class="empty-message">Список задач пустой</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
